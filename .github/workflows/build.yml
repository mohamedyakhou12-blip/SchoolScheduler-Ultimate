name: Build Windows EXE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Build EXE
      run: |
        python -m PyInstaller --onefile --windowed --name SchoolScheduler --add-data "src/core/translations;src/core/translations" --add-data "resources;resources" --exclude-module tkinter --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module PyQt5 --exclude-module PySide6 main.py
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SchoolScheduler-Windows-EXE
        path: dist/SchoolScheduler.exe
        retention-days: 90
